<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Westhagen Plays — Interactive Chat</title>
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>

<header class="pagehead">
  <div class="pagehead-text">
    <h1>westhagen plays</h1>
    <p>Scroll through the neighbourhood chat, choose your own story and see how the design changes.</p>
  </div>
  <button class="restart-btn" id="restartBtn" type="button" aria-label="Restart">&#8635;</button>
</header>

<main class="layout">
  <section class="camera-col" aria-label="Camera view">
    <video id="cameraFeed" class="camera-video" autoplay playsinline muted></video>
    <button class="camera-enable-btn" id="cameraEnableBtn" type="button">Enable camera</button>
    <p class="camera-status" id="cameraStatus" hidden></p>
  </section>

  <section class="phone-wrap" aria-label="Chat">
    <div class="phone-frame">
      <div class="screen">
        <div class="waheader">
          <div class="avatar">L</div>
          <div class="meta">
            <div class="title">Westhagen Marktplatz</div>
            <div class="sub">neighbourhood group</div>
          </div>
        </div>
        <div class="chatbody" id="chatbody"></div>
      </div>
    </div>
  </section>
</main>

<script src="story.js?v=9"></script>
<script src="engine.js?v=9"></script>
</body>
</html>
